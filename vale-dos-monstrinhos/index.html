<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vale dos Monstrinhos</title>
<meta name="description" content="Jogo de fazenda em pixel art: cultive o sítio da sua avó, faça amizade com monstrinhos e explore a caverna.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Tela única de jogo, escura por escolha: o canvas fica centralizado e escala para caber. */
  :root {
    --bg: #10161a; --fg: #f3ead7; --accent: #ffc65c; --panel: rgba(30, 40, 30, 0.6); --line: rgba(255, 198, 92, 0.6);
    --font: VT323, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { flex: 1 1 auto; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #touch { display: none; --k: min(54px, 11vw); --b: min(66px, 14vw); }
  body.touch-on #touch {
    display: flex; justify-content: space-between; align-items: flex-end; width: 100%; box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-top: 8px; gap: 8px;
  }
  @media (orientation: landscape) {
    body.touch-on #touch { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; }
    body.touch-on #touch > * { pointer-events: auto; opacity: 0.55; }
  }
  .dpad { display: grid; grid-template-columns: repeat(3, var(--k)); grid-template-rows: repeat(3, var(--k)); gap: 4px; flex: none; }
  .dpad [data-a="up"] { grid-column: 2; grid-row: 1; }
  .dpad [data-a="left"] { grid-column: 1; grid-row: 2; }
  .dpad [data-a="right"] { grid-column: 3; grid-row: 2; }
  .dpad [data-a="down"] { grid-column: 2; grid-row: 3; }
  .mid { display: grid; grid-template-columns: repeat(2, auto); gap: 8px; flex: none; }
  .btns { display: grid; grid-template-columns: var(--b) var(--b); gap: 8px; flex: none; }
  .btns button { height: var(--b); }
  #touch button { font-family: var(--font); font-size: 22px; color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 0; touch-action: none; }
  #touch .a, #touch .b { border-radius: 50%; font-size: 24px; }
  #touch .small { font-size: 18px; padding: 6px 8px; min-width: 44px; }
  #touch button.on { background: rgba(255, 198, 92, 0.45); }
  #touch button:focus-visible { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="576" tabindex="0" aria-label="Vale dos Monstrinhos — jogo"></canvas></div>
<div id="touch" aria-label="Controles de toque">
  <div class="dpad">
    <button data-a="up" aria-label="Cima">▲</button>
    <button data-a="left" aria-label="Esquerda">◀</button>
    <button data-a="right" aria-label="Direita">▶</button>
    <button data-a="down" aria-label="Baixo">▼</button>
  </div>
  <div class="mid">
    <button class="small" data-a="prev" aria-label="Item anterior">Q◀</button>
    <button class="small" data-a="next" aria-label="Próximo item">▶E</button>
    <button class="small" data-a="mute">Som</button>
  </div>
  <div class="btns">
    <button class="b" data-a="cancel" aria-label="Menu ou voltar">X</button>
    <button class="a" data-a="ok" aria-label="Usar ou interagir">Z</button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/artbase.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/uibase.js"></script>
<script src="js/maps.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
